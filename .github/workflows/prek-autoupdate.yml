name: Reusable prek autoupdate

on:
  workflow_call:
    inputs:
      branch_name:
        description: "The branch to create for the PR"
        required: false
        default: "bot/prek-autoupdate"
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run prek autoupdate
        id: autoupdate
        run: |
          {
            echo 'UPDATE_LOG<<EOF'
            uv run --with prek prek autoupdate 2>&1
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ inputs.branch_name }}"
          
          # 1. Check if files actually changed
          if [ -z "$(git status --porcelain .pre-commit-config.y*ml)" ]; then
            echo "No changes detected. Skipping PR creation."
            exit 0
          fi

          # 2. Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Prepare the branch properly
          # Stash changes, move to a clean state of main, then apply changes on the new branch
          git stash
          git checkout main
          git pull origin main
          git checkout -B "$BRANCH_NAME"
          git stash pop

          # 4. Commit and Push
          git add .pre-commit-config.y*ml
          git commit -m "chore(deps): update pre-commit hooks"
          git push origin "$BRANCH_NAME" --force

          # 5. Parse the UPDATE_LOG
          UPDATES=$(echo "$UPDATE_LOG" | grep "updating" | sed -E "s/.*\/([^/]+)\] updating (.*) -> (.*)/- **\1**: \`\2\` → \`\3\`/" || true)
          UNCHANGED=$(echo "$UPDATE_LOG" | grep "already up to date" | sed -E "s/.*\/([^/]+)\] .*/- \1/" || true)
          UNCHANGED_COUNT=$(echo "$UNCHANGED" | grep -c "^-" || echo 0)

          {
            echo "## 🚀 Pre-commit Hook Updates"
            echo ""
            echo "Update pre-commit hooks using \`prek autoupdate\`."
            echo ""
            echo "### ✅ Applied Updates"
            echo "${UPDATES:-*No hook updates detected in log.*}"
          } > pr_body.txt

          if [ "$UNCHANGED_COUNT" -gt 0 ]; then
            {
              echo ""
              echo "<details>"
              echo "<summary>🔍 View $UNCHANGED_COUNT unchanged hooks</summary>"
              echo ""
              echo "$UNCHANGED"
              echo "</details>"
            } >> pr_body.txt
          fi

          PR_BODY=$(cat pr_body.txt)

          # 6. Create or Update PR
          # Use 'gh pr list' to check existence reliably
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
          else
            gh pr create \
              --title "chore(deps): update pre-commit hooks" \
              --body "$PR_BODY" \
              --head "$BRANCH_NAME" \
              --base main \
              --label "dependencies"
          fi
