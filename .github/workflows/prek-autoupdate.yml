name: Reusable prek autoupdate

on:
  workflow_call:
    inputs:
      branch_name:
        description: "The branch to create for the PR"
        required: false
        default: "bot/prek-autoupdate"
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches all history for all branches and tags

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/requirements*.txt
            .pre-commit-config.y*ml

      - name: Run prek autoupdate
        id: autoupdate
        run: |
          {
            echo 'UPDATE_LOG<<EOF'
            uv run --with prek prek autoupdate 2>&1
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain .pre-commit-config.y*ml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ inputs.branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force reset to main and create/reset the bot branch
          git checkout -B "$BRANCH_NAME"
          git add .pre-commit-config.y*ml
          git commit -m "chore(deps): update pre-commit hooks"

          git push origin "$BRANCH_NAME" --force

          # Parse the UPDATE_LOG to extract signal from noise
          # Use escaped backticks to satisfy shellcheck SC2016
          UPDATES=$(echo "$UPDATE_LOG" | grep "updating" | sed -E "s/.*\/([^/]+)\] updating (.*) -> (.*)/- **\1**: \`\2\` → \`\3\`/" || true)
          UNCHANGED=$(echo "$UPDATE_LOG" | grep "already up to date" | sed -E "s/.*\/([^/]+)\] .*/- \1/" || true)
          UNCHANGED_COUNT=$(echo "$UNCHANGED" | grep -c "^-" || echo 0)

          # Construct PR body in a YAML-safe way using a heredoc or multiple echos
          {
            echo "## 🚀 Pre-commit Hook Updates"
            echo ""
            echo "Update pre-commit hooks using \`prek autoupdate\`."
            echo ""
            echo "### ✅ Applied Updates"
            echo "${UPDATES:-*No hook updates detected in log.*}"
          } > pr_body.txt

          if [ "$UNCHANGED_COUNT" -gt 0 ]; then
            {
              echo ""
              echo "<details>"
              echo "<summary>🔍 View $UNCHANGED_COUNT unchanged hooks</summary>"
              echo ""
              echo "$UNCHANGED"
              echo "</details>"
            } >> pr_body.txt
          fi

          PR_BODY=$(cat pr_body.txt)

          # Create PR if it doesn't exist, otherwise update the body of the existing one
          gh pr create \
            --title "chore(deps): update pre-commit hooks" \
            --body "$PR_BODY" \
            --head "$BRANCH_NAME" \
            --base main \
            --label "dependencies" || \
          gh pr edit "$BRANCH_NAME" --body "$PR_BODY"
