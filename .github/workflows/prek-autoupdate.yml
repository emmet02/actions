name: Reusable prek autoupdate

on:
  workflow_call:
    inputs:
      branch_name:
        description: "The branch to create for the PR"
        required: false
        default: "bot/prek-autoupdate"
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/requirements*.txt
            .pre-commit-config.y*ml
            prek.toml

      - name: Run prek autoupdate
        id: autoupdate
        run: |
          {
            echo 'UPDATE_LOG<<EOF'
            uv run --with prek prek autoupdate 2>&1
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ inputs.branch_name }}"
          
          # 1. Detect Default Branch (main vs master)
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          echo "Detected default branch: $DEFAULT_BRANCH"

          # 2. Check for changes in YAML or TOML
          # Using 2>/dev/null ensures it doesn't error if one file is missing
          if [ -z "$(git status --porcelain .pre-commit-config.y*ml prek.toml 2>/dev/null)" ]; then
            echo "No changes detected. Skipping PR creation."
            exit 0
          fi

          # 3. Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 4. Prepare the branch properly
          git stash
          git checkout "$DEFAULT_BRANCH"
          git pull origin "$DEFAULT_BRANCH"
          git checkout -B "$BRANCH_NAME"
          git stash pop

          # 5. Commit and Push
          git add .pre-commit-config.y*ml prek.toml 2>/dev/null || true
          git commit -m "chore(deps): update pre-commit hooks"
          git push origin "$BRANCH_NAME" --force

          # 6. Parse the UPDATE_LOG for the PR body
          UPDATES=$(echo "$UPDATE_LOG" | grep "updating" | sed -E "s/.*\/([^/]+)\] updating (.*) -> (.*)/- **\1**: \`\2\` → \`\3\`/" || true)
          UNCHANGED=$(echo "$UPDATE_LOG" | grep "already up to date" | sed -E "s/.*\/([^/]+)\] .*/- \1/" || true)
          UNCHANGED_COUNT=$(echo "$UNCHANGED" | grep -c "^-" || echo 0)

          {
            echo "## 🚀 Pre-commit Hook Updates"
            echo ""
            echo "Update pre-commit hooks using \`prek autoupdate\`."
            echo ""
            echo "### ✅ Applied Updates"
            echo "${UPDATES:-*No hook updates detected in log.*}"
          } > pr_body.txt

          if [ "$UNCHANGED_COUNT" -gt 0 ]; then
            {
              echo ""
              echo "<details>"
              echo "<summary>🔍 View $UNCHANGED_COUNT unchanged hooks</summary>"
              echo ""
              echo "$UNCHANGED"
              echo "</details>"
            } >> pr_body.txt
          fi

          PR_BODY=$(cat pr_body.txt)

          # 7. Create or Update PR
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
          else
            echo "Creating new PR"
            gh pr create \
              --title "chore(deps): update pre-commit hooks" \
              --body "$PR_BODY" \
              --head "$BRANCH_NAME" \
              --base "$DEFAULT_BRANCH" \
              --label "dependencies"
          fi
