name: Reusable prek autoupdate

on:
  workflow_call:
    inputs:
      branch_name:
        description: "The branch to create for the PR"
        required: false
        default: "bot/prek-autoupdate"
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run prek autoupdate
        id: autoupdate
        run: |
          {
            echo 'UPDATE_LOG<<EOF'
            uv run --with prek prek autoupdate 2>&1
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain .pre-commit-config.yml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ inputs.branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force reset to main and create/reset the bot branch
          git checkout -B "$BRANCH_NAME"
          git add .pre-commit-config.yml
          git commit -m "chore(deps): update pre-commit hooks"

          git push origin "$BRANCH_NAME" --force

          PR_BODY="Update pre-commit hooks using \`prek autoupdate\`.

          ### Latest Update Summary:
          \`\`\`
          ${{ env.UPDATE_LOG }}
          \`\`\`"

          # Create PR if it doesn't exist, otherwise update the body of the existing one
          gh pr create \
            --title "chore(deps): update pre-commit hooks" \
            --body "$PR_BODY" \
            --head "$BRANCH_NAME" \
            --base main \
            --label "dependencies" || \
          gh pr edit "$BRANCH_NAME" --body "$PR_BODY"
