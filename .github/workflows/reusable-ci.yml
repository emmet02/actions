name: Reusable CI

on:
    workflow_call:

jobs:
    test:
        name: Test and Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Install dependencies
              run: uv sync --all-extras --dev

            - name: Run pre-commit hooks
              uses: j178/prek-action@v1

            - name: Run tests
              run: uv run pytest
